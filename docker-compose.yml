version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: forgeai-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: forgeai
      POSTGRES_PASSWORD: password
      POSTGRES_DB: forgeai_identity
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: forgeai-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

