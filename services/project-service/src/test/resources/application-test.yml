spring:
  application:
    name: project-service-test

  datasource:
    url: jdbc:h2:mem:projectdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=KEY
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

outbox:
  poll:
    interval-ms: 3600000
  publisher:
    batch-size: 50
    max-attempts: 5
