spring:
  application:
    name: project-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/forgeai_project}
    username: ${SPRING_DATASOURCE_USERNAME:forgeai}
    password: ${SPRING_DATASOURCE_PASSWORD:password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.forgeai: DEBUG
    org.flywaydb: INFO

outbox:
  poll:
    interval-ms: 500
  publisher:
    batch-size: 50
    max-attempts: 5

services:
  source-control:
    url: ${SOURCE_CONTROL_SERVICE_URL:http://localhost:8082}
  testing:
    url: ${TESTING_SERVICE_URL:http://localhost:8083}
  ai:
    url: ${AI_SERVICE_URL:http://localhost:8084}

