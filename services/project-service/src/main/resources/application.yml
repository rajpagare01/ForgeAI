spring:
  application:
    name: project-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/forgeai_project}
    username: ${SPRING_DATASOURCE_USERNAME:forgeai}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    hikari:
      connection-timeout: 10000
      validation-timeout: 5000
      max-lifetime: 180000
      idle-timeout: 60000
      keepalive-time: 30000
      maximum-pool-size: 20
      minimum-idle: 5
      leak-detection-threshold: 60000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.forgeai: DEBUG
    org.flywaydb: INFO

outbox:
  poll:
    interval-ms: 2000
  publisher:
    batch-size: 50
    max-attempts: 5

services:
  source-control:
    url: ${SOURCE_CONTROL_SERVICE_URL:http://localhost:8082}
  testing:
    url: ${TESTING_SERVICE_URL:http://localhost:8083}
  ai:
    url: ${AI_SERVICE_URL:http://localhost:8084}

forgeai:
  security:
    enforce-internal-marker: ${ENFORCE_INTERNAL_MARKER:true}

