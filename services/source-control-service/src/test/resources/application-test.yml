spring:
  application:
    name: source-control-service-test
  datasource:
    url: jdbc:h2:mem:sourcecontroldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=KEY
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

forgeai:
  rabbitmq:
    enabled: false
  security:
    enforce-internal-marker: false
  github:
    webhook-secret: test-webhook-secret-key-xyz
