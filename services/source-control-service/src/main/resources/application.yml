server:
  port: 8082

spring:
  application:
    name: source-control-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:source_control_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      connection-timeout: 10000
      validation-timeout: 5000
      max-lifetime: 180000
      idle-timeout: 60000
      keepalive-time: 30000
      maximum-pool-size: 20
      minimum-idle: 5
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:${RABBITMQ_HOST:localhost}}
    port: ${SPRING_RABBITMQ_PORT:${RABBITMQ_PORT:5672}}
    username: ${SPRING_RABBITMQ_USERNAME:${RABBITMQ_USER:forgeai}}
    password: ${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD:password}}
    connection-timeout: 5000
    listener:
      simple:
        auto-startup: ${FORGEAI_RABBITMQ_ENABLED:true}
        missing-queues-fatal: false
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: false
 
forgeai:
  rabbitmq:
    enabled: ${FORGEAI_RABBITMQ_ENABLED:true}
    exchange: forgeai.events.exchange
    dlx: forgeai.events.dlx
    dlq: forgeai.events.dlq
  outbox:
    poll-interval-ms: 2000
    batch-size: 50
    max-attempts: 5
  security:
    enforce-internal-marker: ${ENFORCE_INTERNAL_MARKER:true}
  github:
    # Numeric GitHub App ID — required for GitHub integration
    # Set via GITHUB_APP_ID environment variable
    app-id: ${GITHUB_APP_ID:}
    app-slug: ${GITHUB_APP_SLUG:}
    # RSA private key in PKCS#8 PEM format (if supplied as an inline string)
    private-key: ${GITHUB_PRIVATE_KEY:}
    # Path to RSA private key file on disk (default: secrets/github-app-private-key.pem)
    private-key-path: ${GITHUB_PRIVATE_KEY_PATH:secrets/github-app-private-key.pem}
    # Webhook shared secret — must match the secret configured in GitHub App settings.
    # Set via GITHUB_WEBHOOK_SECRET environment variable.
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    commit-polling-enabled: ${GITHUB_COMMIT_POLLING_ENABLED:true}
    commit-poll-interval-ms: ${GITHUB_COMMIT_POLL_INTERVAL_MS:30000}
    commit-poll-initial-delay-ms: ${GITHUB_COMMIT_POLL_INITIAL_DELAY_MS:15000}
  services:
    identity-service:
      url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
    testing-service:
      url: ${TESTING_SERVICE_URL:http://testing-service:8083}
    ai-service:
      url: ${AI_SERVICE_URL:http://ai-service:8084}

