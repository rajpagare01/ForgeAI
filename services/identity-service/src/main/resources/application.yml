spring:
  application:
    name: identity-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/forgeai_identity}
    username: ${SPRING_DATASOURCE_USERNAME:forgeai}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate  # Flyway manages the schema; Hibernate only validates
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.forgeai: DEBUG
    org.flywaydb: INFO

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY:}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    rsa:
      key-id: ${JWT_RSA_KEY_ID:forgeai-identity-key-v1}
      public-key: ${JWT_RSA_PUBLIC_KEY:}
      private-key: ${JWT_RSA_PRIVATE_KEY:}

outbox:
  poll:
    interval-ms: 500
  publisher:
    batch-size: 50
    max-attempts: 5

