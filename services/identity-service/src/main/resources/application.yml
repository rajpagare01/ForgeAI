spring:
  application:
    name: identity-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/forgeai_identity}
    username: ${SPRING_DATASOURCE_USERNAME:forgeai}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    hikari:
      connection-timeout: 10000
      validation-timeout: 5000
      max-lifetime: 180000
      idle-timeout: 60000
      keepalive-time: 30000
      maximum-pool-size: 20
      minimum-idle: 5
      leak-detection-threshold: 60000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate  # Flyway manages the schema; Hibernate only validates
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:${RABBITMQ_HOST:localhost}}
    port: ${SPRING_RABBITMQ_PORT:${RABBITMQ_PORT:5672}}
    username: ${SPRING_RABBITMQ_USERNAME:${RABBITMQ_USER:forgeai}}
    password: ${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD:password}}
    connection-timeout: 5000
    listener:
      simple:
        auto-startup: ${FORGEAI_RABBITMQ_ENABLED:true}
        missing-queues-fatal: false
        default-requeue-rejected: false

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: false

logging:
  level:
    com.forgeai: DEBUG
    org.flywaydb: INFO

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY:}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    rsa:
      key-id: ${JWT_RSA_KEY_ID:forgeai-identity-key-v1}
      public-key: ${JWT_RSA_PUBLIC_KEY:}
      private-key: ${JWT_RSA_PRIVATE_KEY:}
      public-key-path: ${SECURITY_JWT_RSA_PUBLIC_KEY_PATH:${JWT_RSA_PUBLIC_KEY_PATH:}}
      private-key-path: ${SECURITY_JWT_RSA_PRIVATE_KEY_PATH:${JWT_RSA_PRIVATE_KEY_PATH:}}

outbox:
  poll:
    interval-ms: 2000
  publisher:
    batch-size: 50
    max-attempts: 5

forgeai:
  rabbitmq:
    enabled: ${FORGEAI_RABBITMQ_ENABLED:true}
    exchange: forgeai.events.exchange
    dlx: forgeai.events.dlx
    dlq: forgeai.events.dlq
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:3000/auth/github/callback}
    token-encryption-key: ${GITHUB_TOKEN_ENCRYPTION_KEY:${JWT_SECRET_KEY:default-32-byte-encryption-key-for-dev}}

