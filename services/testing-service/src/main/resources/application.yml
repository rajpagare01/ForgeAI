server:
  port: 8083

spring:
  application:
    name: testing-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:testing_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      connection-timeout: 10000
      validation-timeout: 5000
      max-lifetime: 180000
      idle-timeout: 60000
      keepalive-time: 30000
      maximum-pool-size: 20
      minimum-idle: 5
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

forgeai:
  outbox:
    poll-interval-ms: 2000
    batch-size: 50
    max-attempts: 5
  security:
    enforce-internal-marker: ${ENFORCE_INTERNAL_MARKER:true}
