name: ForgeAI CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Job 1: Test & Build all Java Modules (Identity, Project, Source Control, Testing, Gateway)
  backend-test:
    name: Backend Build & Test (Java 21)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forgeai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forgeai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Run Backend Tests
        env:
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: forgeai_test
          DB_USER: forge
          DB_PASSWORD: forge
        run: mvn clean verify --batch-mode

  # Job 2: AI Intelligence Service Tests (Python 3.11 / FastAPI / pytest)
  ai-test:
    name: AI Intelligence Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'services/ai-service/requirements.txt'

      - name: Install AI Dependencies
        run: |
          cd services/ai-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run AI Unit & API Tests
        env:
          GEMINI_API_KEY: mock-gemini-test-key
          ENVIRONMENT: test
        run: |
          cd services/ai-service
          pytest

  # Job 3: Frontend Web Dashboard Build & Typecheck (Next.js 16)
  frontend-build:
    name: Frontend Build & Typecheck (Node.js 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Typecheck and Production Build
        run: |
          cd frontend
          npm run build

  # Job 4: Validate Docker Compose Configuration & Packaging
  docker-compose-validate:
    name: Validate Docker Compose (Dev & Prod)
    needs: [backend-test, ai-test, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dev Compose Config
        run: docker compose -f docker-compose.dev.yml config -q

      - name: Validate Prod Compose Config
        env:
          POSTGRES_PASSWORD: ci-prod-validation-password
          GITHUB_TOKEN_ENCRYPTION_KEY: ${{ secrets.GITHUB_TOKEN_ENCRYPTION_KEY || 'ci-prod-validation-encryption-key-32b' }}
        run: docker compose -f docker-compose.prod.yml config -q
