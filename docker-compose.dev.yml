services:
  # ----------------------------------------------------------------------------
  # Data Layer: PostgreSQL 16 with pgvector & multi-database init
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: forgeai-postgres-dev
    command: postgres -c max_connections=250 -c shared_buffers=256MB -c checkpoint_timeout=15min -c max_wal_size=2GB
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forgeai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: postgres
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
      - ./scripts/docker/init-multi-postgres.sh:/docker-entrypoint-initdb.d/init-multi-postgres.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeai -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - forgeai-network

  # ----------------------------------------------------------------------------
  # Cache & Rate Limiting: Redis 7 Standalone with AOF Persistence
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: forgeai-redis-dev
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - forgeai-network

  # ----------------------------------------------------------------------------
  # Message Broker: RabbitMQ 3.13 with Management UI (AMQP 0-9-1 + DLQ Mesh)
  # ----------------------------------------------------------------------------
  rabbitmq:
    init: true
    hostname: rabbitmq
    image: rabbitmq:3.13-management-alpine
    container_name: forgeai-rabbitmq-dev
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-forgeai}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-password}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-forgeai_secret_cookie_2026}
    volumes:
      - rabbitmq_data_dev:/var/lib/rabbitmq/mnesia
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 30s
    restart: unless-stopped
    networks:
      - forgeai-network

  # ----------------------------------------------------------------------------
  # Core Domain: Identity Service (Java 21 / Spring Boot 3)
  # ----------------------------------------------------------------------------
  identity-service:
    init: true
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: forgeai-identity-dev
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/forgeai_identity?connectTimeout=5&socketTimeout=10&tcpKeepAlive=true
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-forgeai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SERVER_PORT: 8081
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_ISSUER: ${JWT_ISSUER:-forgeai-identity}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      SECURITY_JWT_RSA_PUBLIC_KEY_PATH: /app/secrets/jwt-rsa-public.pem
      SECURITY_JWT_RSA_PRIVATE_KEY_PATH: /app/secrets/jwt-rsa-private.pem
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-forgeai}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-password}
      FORGEAI_RABBITMQ_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-Xmx512m -Djava.security.egd=file:/dev/./urandom -Djava.net.preferIPv4Stack=true"
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - forgeai-network

  # ----------------------------------------------------------------------------
  # Core Domain: Project Service (Java 21 / Spring Boot 3)
  # ----------------------------------------------------------------------------
  project-service:
    build:
      context: .
      dockerfile: services/project-service/Dockerfile
    container_name: forgeai-project-dev
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/forgeai_project
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-forgeai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SERVER_PORT: 8085
      SERVICES_SOURCE_CONTROL_URL: http://source-control-service:8082
      SERVICES_TESTING_URL: http://testing-service:8083
      SERVICES_AI_URL: http://ai-service:8084
      SOURCE_CONTROL_SERVICE_URL: http://source-control-service:8082
      TESTING_SERVICE_URL: http://testing-service:8083
      AI_SERVICE_URL: http://ai-service:8084
      ENFORCE_INTERNAL_MARKER: "true"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-forgeai}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-password}
      FORGEAI_RABBITMQ_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom -Djava.net.preferIPv4Stack=true"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    init: true
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - forgeai-network

  # ----------------------------------------------------------------------------
  # Core Domain: Source Control Service (Java 21 / Spring Boot 3)
  # ----------------------------------------------------------------------------
  source-control-service:
    build:
      context: .
      dockerfile: services/source-control-service/Dockerfile
    container_name: forgeai-source-control-dev
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/source_control_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-forgeai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SERVER_PORT: 8082
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-forgeai-raj-dev}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_PRIVATE_KEY_PATH: ${GITHUB_PRIVATE_KEY_PATH:-/app/secrets/github-app-private-key.pem}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      ENFORCE_INTERNAL_MARKER: "true"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-forgeai}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-password}
      FORGEAI_RABBITMQ_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom -Djava.net.preferIPv4Stack=true"
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    init: true
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - forgeai-network

  # ----------------------------------------------------------------------------
  # Core Domain: Testing Service (Java 21 / Spring Boot 3)
  # ----------------------------------------------------------------------------
  testing-service:
    init: true
    build:
      context: .
      dockerfile: services/testing-service/Dockerfile
    container_name: forgeai-testing-dev
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testing_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-forgeai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SERVER_PORT: 8083
      ENFORCE_INTERNAL_MARKER: "true"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-forgeai}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-password}
      FORGEAI_RABBITMQ_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom -Djava.net.preferIPv4Stack=true"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - forgeai-network

  # ----------------------------------------------------------------------------
  # Intelligence: AI Service (Python 3.11 / FastAPI / pgvector)
  # ----------------------------------------------------------------------------
  ai-service:
    build:
      context: services/ai-service
      dockerfile: Dockerfile
    container_name: forgeai-ai-dev
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-forgeai}:${POSTGRES_PASSWORD:-password}@postgres:5432/ai_db
      REDIS_URL: redis://redis:6379/0
      PORT: 8084
      ENVIRONMENT: ${ENVIRONMENT:-development}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-models/gemini-embedding-001}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      ALLOW_TEST_FALLBACK: ${ALLOW_TEST_FALLBACK:-false}
      ENFORCE_INTERNAL_MARKER: "true"
      ENABLE_EMAIL_ALERTS: ${ENABLE_EMAIL_ALERTS:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-alerts@forgeai.dev}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      ALERT_FALLBACK_EMAIL: ${ALERT_FALLBACK_EMAIL:-}
    volumes:
      - ./services/ai-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - forgeai-network

  # ----------------------------------------------------------------------------
  # Edge Gateway: Spring Cloud Gateway (Java 21 / Reactive)
  # ----------------------------------------------------------------------------
  api-gateway:
    init: true
    build:
      context: .
      dockerfile: infrastructure/api-gateway/Dockerfile
    container_name: forgeai-api-gateway-dev
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      IDENTITY_SERVICE_URI: http://identity-service:8081
      PROJECT_SERVICE_URI: http://project-service:8085
      SOURCE_CONTROL_SERVICE_URI: http://source-control-service:8082
      TESTING_SERVICE_URI: http://testing-service:8083
      AI_SERVICE_URI: http://ai-service:8084
      JWK_SET_URI: http://identity-service:8081/.well-known/jwks.json
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom -Djava.net.preferIPv4Stack=true"
    depends_on:
      identity-service:
        condition: service_started
      project-service:
        condition: service_started
      source-control-service:
        condition: service_started
      testing-service:
        condition: service_started
      ai-service:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - forgeai-network

  # ----------------------------------------------------------------------------
  # Presentation: Web Dashboard (Next.js 16 / TypeScript / Tailwind CSS)
  # ----------------------------------------------------------------------------
  frontend:
    init: true
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forgeai-frontend-dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8080
      NODE_ENV: production
      PORT: 3000
    volumes:
      - ./frontend/public:/app/public
    depends_on:
      api-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - forgeai-network

# ------------------------------------------------------------------------------
# Storage & Network Definitions
# ------------------------------------------------------------------------------
volumes:
  pg_data_dev:
  redis_data_dev:
  rabbitmq_data_dev:

networks:
  forgeai-network:
    driver: bridge
