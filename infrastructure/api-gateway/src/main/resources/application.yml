server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      routes:
        - id: webhook-route
          uri: ${SOURCE_CONTROL_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/webhooks/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@webhookKeyResolver}"
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**,/.well-known/**,/api/v1/users/**,/api/v1/organizations/**,/api/v1/workspaces/**,/api/v1/invitations/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
        - id: project-operations
          uri: ${PROJECT_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/operations/circuit-breakers,/api/v1/operations/traceability/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 50
                key-resolver: "#{@userKeyResolver}"
        - id: project-service
          uri: ${PROJECT_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/projects/**,/api/v1/requirements/**,/api/v1/tasks/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
        - id: source-control-operations
          uri: ${SOURCE_CONTROL_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/operations/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 50
                key-resolver: "#{@userKeyResolver}"
        - id: source-control-service
          uri: ${SOURCE_CONTROL_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/source-control/**,/api/v1/repositories/**,/api/v1/pull-requests/**,/api/v1/installations/**,/api/v1/github/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
        - id: testing-service
          uri: ${TESTING_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/testing/**,/api/v1/test-runs/**,/api/v1/test-cases/**,/api/v1/traceability/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
        - id: ai-service
          uri: ${AI_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
