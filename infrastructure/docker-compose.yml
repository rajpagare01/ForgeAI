version: '3.8'

services:
  # ==========================================
  # CORE PROFILE (Always On)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: forgeai-postgres
    profiles: ["core"]
    environment:
      POSTGRES_USER: forgeai
      POSTGRES_PASSWORD: forgeai_password
      POSTGRES_DB: default_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forgeai-redis
    profiles: ["core"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: forgeai-kafka
    profiles: ["core"]
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: forgeai-schema-registry
    profiles: ["core"]
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: forgeai-kafka-ui
    profiles: ["core"]
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  spicedb:
    image: authzed/spicedb:latest
    container_name: forgeai-spicedb
    profiles: ["core"]
    depends_on:
      postgres:
        condition: service_healthy
    command: serve --grpc-preshared-key "forgeai-secret-key" --datastore-engine postgres --datastore-conn-uri "postgres://forgeai:forgeai_password@postgres:5432/spicedb_db?sslmode=disable"
    ports:
      - "50051:50051"

  # ==========================================
  # EXTENDED PROFILE
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: forgeai-minio
    profiles: ["extended"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: forgeai-mailhog
    profiles: ["extended"]
    ports:
      - "1025:1025"
      - "8025:8025"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: forgeai-qdrant
    profiles: ["extended"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # ==========================================
  # FULL PROFILE
  # ==========================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: forgeai-jaeger
    profiles: ["full"]
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  prometheus:
    image: prom/prometheus:latest
    container_name: forgeai-prometheus
    profiles: ["full"]
    # Provide a touch so it starts without error even without proper config file mapped yet
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: forgeai-grafana
    profiles: ["full"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"

  loki:
    image: grafana/loki:latest
    container_name: forgeai-loki
    profiles: ["full"]
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:latest
    container_name: forgeai-promtail
    profiles: ["full"]
    volumes:
      - /var/log:/var/log

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: forgeai-otel-collector
    profiles: ["full"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
