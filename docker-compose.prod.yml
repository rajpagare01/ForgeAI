services:
  # ----------------------------------------------------------------------------
  # Data Layer: PostgreSQL 16 with pgvector & multi-database init
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: forgeai-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forgeai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      POSTGRES_DB: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/docker/init-multi-postgres.sh:/docker-entrypoint-initdb.d/init-multi-postgres.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgeai} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - forgeai-internal
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  # ----------------------------------------------------------------------------
  # Cache & Rate Limiting: Redis 7 Standalone with AOF Persistence
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: forgeai-redis-prod
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - forgeai-internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ----------------------------------------------------------------------------
  # Core Domain: Identity Service (Java 21 / Spring Boot 3)
  # ----------------------------------------------------------------------------
  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: forgeai-identity-prod
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/forgeai_identity
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-forgeai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      SERVER_PORT: 8081
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    restart: unless-stopped
    networks:
      - forgeai-internal
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  # ----------------------------------------------------------------------------
  # Core Domain: Project Service (Java 21 / Spring Boot 3)
  # ----------------------------------------------------------------------------
  project-service:
    build:
      context: .
      dockerfile: services/project-service/Dockerfile
    container_name: forgeai-project-prod
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/forgeai_project
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-forgeai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      SERVER_PORT: 8085
      ENFORCE_INTERNAL_MARKER: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    restart: unless-stopped
    networks:
      - forgeai-internal
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  # ----------------------------------------------------------------------------
  # Core Domain: Source Control Service (Java 21 / Spring Boot 3)
  # ----------------------------------------------------------------------------
  source-control-service:
    build:
      context: .
      dockerfile: services/source-control-service/Dockerfile
    container_name: forgeai-source-control-prod
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: source_control_db
      DB_USER: ${POSTGRES_USER:-forgeai}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      SERVER_PORT: 8082
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # GitHub App credentials — inject these to enable GitHub integration
      # Leave unset to run in unconfigured mode (GitHub features return 503)
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GITHUB_PRIVATE_KEY_PATH: ${GITHUB_PRIVATE_KEY_PATH:-/app/secrets/github-app-private-key.pem}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      ENFORCE_INTERNAL_MARKER: "true"
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    restart: unless-stopped
    networks:
      - forgeai-internal
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  # ----------------------------------------------------------------------------
  # Core Domain: Testing Service (Java 21 / Spring Boot 3)
  # ----------------------------------------------------------------------------
  testing-service:
    build:
      context: .
      dockerfile: services/testing-service/Dockerfile
    container_name: forgeai-testing-prod
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: testing_db
      DB_USER: ${POSTGRES_USER:-forgeai}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      SERVER_PORT: 8083
      ENFORCE_INTERNAL_MARKER: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    restart: unless-stopped
    networks:
      - forgeai-internal
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  # ----------------------------------------------------------------------------
  # Core Intelligence: AI Service (Python 3.12 / FastAPI)
  # ----------------------------------------------------------------------------
  ai-service:
    build:
      context: services/ai-service
      dockerfile: Dockerfile
    container_name: forgeai-ai-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-forgeai}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}@postgres:5432/ai_db
      REDIS_URL: redis://redis:6379/0
      PORT: 8084
      ENVIRONMENT: ${ENVIRONMENT:-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-pro}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-models/text-embedding-004}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      ALLOW_TEST_FALLBACK: ${ALLOW_TEST_FALLBACK:-false}
      ENFORCE_INTERNAL_MARKER: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - forgeai-internal
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  # ----------------------------------------------------------------------------
  # Edge Gateway: API Gateway (Spring Cloud Gateway / WebFlux)
  # ----------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/api-gateway/Dockerfile
    container_name: forgeai-api-gateway-prod
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      IDENTITY_SERVICE_URI: http://identity-service:8081
      PROJECT_SERVICE_URI: http://project-service:8085
      SOURCE_CONTROL_SERVICE_URI: http://source-control-service:8082
      TESTING_SERVICE_URI: http://testing-service:8083
      AI_SERVICE_URI: http://ai-service:8084
      JWK_SET_URI: http://identity-service:8081/.well-known/jwks.json
    depends_on:
      redis:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
      source-control-service:
        condition: service_healthy
      testing-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped
    networks:
      - forgeai-internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  # ----------------------------------------------------------------------------
  # Presentation Layer: Modern Next.js 16 Web Dashboard
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forgeai-frontend-prod
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8080
      PORT: 3000
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - forgeai-internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

networks:
  forgeai-internal:
    name: forgeai-internal
    driver: bridge

volumes:
  pg_data:
    name: forgeai_pg_data
  redis_data:
    name: forgeai_redis_data
